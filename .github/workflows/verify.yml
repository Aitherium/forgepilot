name: Verify ForgePilot

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pack
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the GitHub Pages bundle
        run: python -m aitherium_pack publish --output _site --mcp-endpoint "${FORGEPILOT_MCP_ENDPOINT:-/mcp}"
        env:
          FORGEPILOT_MCP_ENDPOINT: ${{ vars.FORGEPILOT_MCP_ENDPOINT }}

      - name: Check the static bundle
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/sw.js
          test -f _site/config.js
          grep -q '"start_url": "./"' _site/manifest.webmanifest
          grep -q 'FORGEPILOT_MCP_ENDPOINT' _site/config.js

      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: forgepilot-pages-preview
          path: _site
