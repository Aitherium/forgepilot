[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepilot-awdk-pack"
version = "0.1.0"
description = "Aitherium agent pack with Exa, OpenRouter, MCP, and WebMCP surfaces"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
forgepilot = "aitherium_pack.cli:main"

[tool.setuptools]
packages = ["aitherium_pack"]
